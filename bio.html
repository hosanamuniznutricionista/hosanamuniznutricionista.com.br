<style>

@media (prefers-color-scheme:dark){:root{--ground:#14170E;--papel:#1D2117;--papel2:#262B1D;--linha:#333927;--linhaf:#4D543E;--tinta:#EDEBDE;--tinta2:#B7BDA6;--tinta3:#8B917B;--acento:#C6D2B9;--sobre:#14170E;--realce:#E7BE79;}}
:root[data-p="oliva"]{--ground:#F7F5EF;--papel:#FFFFFF;--papel2:#EFEDE3;--linha:#E0DCCC;--linhaf:#C7C2AE;--tinta:#2C2C28;--tinta2:#5C6353;--tinta3:#7E846F;--acento:#4A5240;--sobre:#F7F5EF;--realce:#A97316;}

:root[data-p="petroleo"]{--ground:#F2F6F6;--papel:#FFFFFF;--papel2:#E6EEEE;--linha:#D5E2E1;--linhaf:#B0C4C2;--tinta:#12201F;--tinta2:#44575A;--tinta3:#6B7E80;--acento:#0F4C4A;--sobre:#F2F6F6;--realce:#B2452C;}
@media (prefers-color-scheme:dark){:root[data-p="petroleo"]{--ground:#0A1413;--papel:#111D1C;--papel2:#182625;--linha:#22302F;--linhaf:#354745;--tinta:#E6F0EE;--tinta2:#9DB2B0;--tinta3:#748A88;--acento:#82C8C0;--sobre:#0A1413;--realce:#F2906F;}}
:root[data-p="tinta"]{--ground:#FAF9F6;--papel:#FFFFFF;--papel2:#F0EEE8;--linha:#E2DFD7;--linhaf:#C2BEB3;--tinta:#0F0F0F;--tinta2:#4A4A48;--tinta3:#71716D;--acento:#141414;--sobre:#FAF9F6;--realce:#C2371A;}
@media (prefers-color-scheme:dark){:root[data-p="tinta"]{--ground:#0B0B0B;--papel:#161615;--papel2:#1F1F1D;--linha:#2A2A28;--linhaf:#40403D;--tinta:#F5F3EE;--tinta2:#ACAAA4;--tinta3:#84827C;--acento:#F5F3EE;--sobre:#0B0B0B;--realce:#FF7052;}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--tinta);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:26rem;margin:0 auto;padding:2.6rem 1.25rem 2rem;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 1.1rem;
  box-shadow:0 0 0 3px var(--ground),0 0 0 4px var(--realce),0 14px 30px -14px rgba(0,0,0,.35)}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.85rem;letter-spacing:-.01em;line-height:1.15;color:var(--tinta)}
.bio{margin-top:.45rem;display:flex;flex-direction:column;gap:.1rem}
.bio p{font-size:.93rem;color:var(--tinta2)}
.links{margin-top:1.7rem;display:flex;flex-direction:column;gap:.7rem;text-align:left}
.card{display:flex;align-items:center;gap:.85rem;min-height:3.9rem;padding:.8rem .95rem;background:var(--papel);
  border:1px solid var(--linha);border-radius:14px;color:var(--tinta);text-decoration:none;
  transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acento)}
.card.info{background:transparent;border-style:dashed}
.card.info:hover{border-color:var(--linha)}
.card:active{transform:scale(.985)}
.card:focus-visible{outline:2px solid var(--realce);outline-offset:2px}
.card.destaque{background:var(--acento);border-color:var(--acento);color:var(--sobre)}
.ic{width:2.3rem;height:2.3rem;border-radius:10px;background:var(--papel2);color:var(--acento);
  display:flex;align-items:center;justify-content:center;flex:none}
.card.destaque .ic{background:color-mix(in srgb,var(--sobre) 16%,transparent);color:var(--sobre)}
.ic svg{width:1.15rem;height:1.15rem}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:.98rem;line-height:1.3}
.tx small{display:block;font-size:.8rem;color:var(--tinta3);line-height:1.35;margin-top:.1rem}
.card.destaque .tx small{color:color-mix(in srgb,var(--sobre) 78%,transparent)}
.vai{width:1rem;height:1rem;flex:none;color:var(--tinta3)}
.card.destaque .vai{color:var(--sobre)}
.sec{font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta3);margin:1rem 0 -.1rem .2rem}
.esqueleto{height:3.9rem;border-radius:14px;background:var(--papel2);animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.55}}
footer{margin-top:2.4rem;font-size:.74rem;color:var(--tinta3)}
footer a{color:var(--tinta2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<main class="wrap">
  <img class="avatar" src="/links/hosana.jpg?v=3" alt="Hosana Muniz" width="112" height="112">
  <h1>Hosana Muniz</h1>
  <div class="bio" id="bio"></div>
  <nav class="links" id="links" aria-busy="true" aria-label="Links">
    <div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
  </nav>
  <footer>Hosana Muniz · Nutricionista · CRN-3 95279 · <a href="/">site</a></footer>
</main>
<script>
(function(){
  // Link da planilha publicada (Arquivo > Compartilhar > Publicar na Web > CSV).
  // Vazio = usa a lista padrão abaixo. É tudo que precisa mudar aqui.
  var PLANILHA = "";
  var PADRAO = [{"tipo": "cor", "texto": "oliva"}, {"tipo": "bio", "texto": "Nutricionista · mulheres 40+"}, {"tipo": "bio", "texto": "Presencial em São Paulo e online"}, {"tipo": "link", "texto": "Agende sua consulta", "link": "https://wa.me/5513991149157?text=Ol%C3%A1%21%20Vim%20pelo%20seu%20perfil%20e%20gostaria%20de%20agendar%20uma%20consulta.", "detalhe": "Resposta direto no WhatsApp", "destaque": "sim"}, {"tipo": "link", "texto": "Não sabe por onde começar?", "link": "/sintomas", "detalhe": "Marque os sinais que você reconhece"}, {"tipo": "titulo", "texto": "Onde atendo"}, {"tipo": "link", "texto": "Av. Paulista, 2064, 21º andar", "link": "https://www.google.com/maps/search/?api=1&query=Livance+Paulista%2C+Av.+Paulista%2C+2064%2C+S%C3%A3o+Paulo", "detalhe": "Livance · a 1 minuto do metrô Consolação"}, {"tipo": "link", "texto": "Rua Dr. Clemente Jobim, 86", "link": "https://www.google.com/maps/search/?api=1&query=Rua+Doutor+Clemente+Jobim%2C+86%2C+Jardim+da+Gl%C3%B3ria%2C+S%C3%A3o+Paulo", "detalhe": "Clínica SubjetivaMente · Jardim da Glória"}, {"tipo": "texto", "texto": "Online", "detalhe": "Por videochamada, de qualquer lugar do Brasil"}, {"tipo": "titulo", "texto": "Para nutricionistas"}, {"tipo": "link", "texto": "Plataforma Nutra", "link": "https://plataformanutra.com.br", "detalhe": "O sistema para o seu consultório"}];
  var FUNDOS = {"oliva": "#F7F5EF", "clinico": "#F6F7F9", "ameixa": "#F5F0F2", "barro": "#FAF6F1", "petroleo": "#F2F6F6", "tinta": "#FAF9F6"};
  var CACHE = "hm:links-bio";

  function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); }
  function sim(v){ v=norm(v); return v==="sim"||v==="s"||v==="x"||v==="1"||v==="yes"; }
  function nao(v){ v=norm(v); return v==="nao"||v==="n"||v==="0"||v==="no"; }

  // CSV do Google: campo entre aspas pode ter vírgula e quebra de linha.
  function lerCSV(txt){
    var linhas=[], linha=[], campo="", aspas=false;
    for(var i=0;i<txt.length;i++){
      var c=txt[i];
      if(aspas){
        if(c==='"'){ if(txt[i+1]==='"'){campo+='"';i++;} else aspas=false; }
        else campo+=c;
      } else if(c==='"') aspas=true;
      else if(c===','){ linha.push(campo); campo=""; }
      else if(c==='\n'){ linha.push(campo); linhas.push(linha); linha=[]; campo=""; }
      else if(c!=='\r') campo+=c;
    }
    if(campo!==""||linha.length){ linha.push(campo); linhas.push(linha); }
    if(!linhas.length) return [];
    var cab=linhas[0].map(norm);
    return linhas.slice(1).map(function(l){
      var o={}; cab.forEach(function(k,j){ o[k]=(l[j]||"").trim(); }); return o;
    });
  }

  // Só deixa passar endereço de verdade. "javascript:" e afins viram nada.
  function urlSegura(u){
    u=String(u||"").trim(); if(!u) return null;
    if(/^\/(?!\/)/.test(u)) return u;
    if(/^(https?:|mailto:|tel:)/i.test(u)) return u;
    if(/^[\w-]+(\.[\w-]+)+(\/|$)/i.test(u)) return "https://"+u;
    return null;
  }

  var ICONES={
    chat:'<path d="M12 21c-4.97 0-9-3.5-9-8s4.03-8 9-8 9 3.5 9 8c0 1.6-.48 3.1-1.32 4.38.2.86.57 1.86 1.32 2.62-1.13.2-2.24-.03-3.1-.48A9.7 9.7 0 0 1 12 21Z"/>',
    lista:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    folha:'<path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 16-9 0 12-4 16-9 16Z"/><path d="M4 20c4-6 8-9 12-11"/>',
    insta:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>',
    play:'<rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    tel:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
    pino:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',
    tela:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    seta:'<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>'
  };
  function qualIcone(u){
    if(/wa\.me|whatsapp/i.test(u)) return "chat";
    if(/instagram\.com/i.test(u)) return "insta";
    if(/youtube\.com|youtu\.be/i.test(u)) return "play";
    if(/plataformanutra/i.test(u)) return "folha";
    if(/^mailto:/i.test(u)) return "mail";
    if(/^tel:/i.test(u)) return "tel";
    if(/sintomas/i.test(u)) return "lista";
    if(/maps\.|goo\.gl\/maps|maps\.app/i.test(u)) return "pino";
    return "seta";
  }
  function svg(nome, cls){
    var s=document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor");
    s.setAttribute("stroke-width","1.8"); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round");
    s.setAttribute("aria-hidden","true"); if(cls) s.setAttribute("class",cls);
    s.innerHTML=ICONES[nome]; return s;
  }

  function aplicar(itens){
    var bio=document.getElementById("bio"), lista=document.getElementById("links");
    bio.textContent=""; lista.textContent="";
    var algumLink=false;
    itens.forEach(function(it){
      if(nao(it.mostrar)) return;
      var tipo=norm(it.tipo)|| (it.link ? "link" : "titulo");
      var texto=String(it.texto||"").trim();
      if(tipo==="cor"){
        var id=norm(texto);
        if(FUNDOS[id]){ document.documentElement.setAttribute("data-p",id);
          var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",FUNDOS[id]); }
        return;
      }
      if(!texto) return;
      if(tipo==="bio"){ var p=document.createElement("p"); p.textContent=texto; bio.appendChild(p); return; }
      if(tipo==="titulo"){ var h=document.createElement("p"); h.className="sec"; h.textContent=texto; lista.appendChild(h); return; }
      if(tipo==="texto"){
        var d=document.createElement("div"); d.className="card info";
        var ii=document.createElement("span"); ii.className="ic";
        ii.appendChild(svg(/online|v[ií]deo|chamada/i.test(texto+" "+(it.detalhe||""))?"tela":"pino"));
        var tt=document.createElement("span"); tt.className="tx";
        var bb=document.createElement("b"); bb.textContent=texto; tt.appendChild(bb);
        if(it.detalhe){ var ss=document.createElement("small"); ss.textContent=it.detalhe; tt.appendChild(ss); }
        d.appendChild(ii); d.appendChild(tt); lista.appendChild(d); return;
      }
      var url=urlSegura(it.link); if(!url) return;
      var a=document.createElement("a");
      a.className="card"+(sim(it.destaque)?" destaque":"");
      a.href=url;
      if(!/^\//.test(url)){ a.target="_blank"; a.rel="noopener"; }
      var ic=document.createElement("span"); ic.className="ic"; ic.appendChild(svg(qualIcone(url)));
      var tx=document.createElement("span"); tx.className="tx";
      var b=document.createElement("b"); b.textContent=texto; tx.appendChild(b);
      if(it.detalhe){ var sm=document.createElement("small"); sm.textContent=it.detalhe; tx.appendChild(sm); }
      a.appendChild(ic); a.appendChild(tx); a.appendChild(svg("seta","vai"));
      lista.appendChild(a); algumLink=true;
    });
    lista.setAttribute("aria-busy","false");
    return algumLink;
  }

  function doCache(){ try{ return localStorage.getItem(CACHE); }catch(e){ return null; } }
  function paraCache(t){ try{ localStorage.setItem(CACHE,t); }catch(e){} }
  function reserva(){ var c=doCache(); if(!(c && aplicar(lerCSV(c)))) aplicar(PADRAO); }

  if(!PLANILHA){ aplicar(PADRAO); return; }
  var ctrl = window.AbortController ? new AbortController() : null;
  var limite = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 3500);
  fetch(PLANILHA, {cache:"no-store", signal: ctrl ? ctrl.signal : undefined})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(t){
      clearTimeout(limite);
      // Se a planilha vier vazia ou sem nenhum link válido, não deixa a página em branco.
      if(aplicar(lerCSV(t))) paraCache(t); else reserva();
    })
    .catch(function(){ clearTimeout(limite); reserva(); });
})();
</script>
</body>
</html>
